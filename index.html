<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><!--card-start-->
<title>For My Love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Petit+Formal+Script&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff;
    --ground: #fdf2f5;
    --blush: #fbe1e8;
    --petal: #f4b6c7;
    --rose: #d9718f;
    --deep: #a83f63;
    --ink: #4a2533;
    --muted: #8a6070;
    --script: "Petit Formal Script", "Snell Roundhand", "Apple Chancery", cursive;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #fff 0%, var(--ground) 55%, var(--blush) 100%);
    color: var(--ink);
    font-family: var(--serif);
    padding-inline: 16px;
    overflow-x: hidden;
  }
  #petals { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .stage {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding-block: 32px;
  }

  /* Envelope */
  .envelope {
    position: relative;
    width: min(440px, 100%);
    aspect-ratio: 1.45;
    max-width: 100%;
    cursor: pointer;
    border: 0;
    padding: 0;
    background: none;
    font: inherit;
    color: inherit;
    transition: transform .5s ease, opacity .6s ease;
  }
  .envelope:hover { transform: translateY(-4px) rotate(-.6deg); }
  .envelope:focus-visible { outline: 2px solid var(--deep); outline-offset: 8px; border-radius: 6px; }
  .env-body {
    position: absolute; inset: 0;
    background: var(--paper);
    border-radius: 6px;
    box-shadow: 0 24px 50px -24px rgba(168, 63, 99, .45), 0 2px 0 var(--blush) inset;
    overflow: hidden;
  }
  .env-body::before, .env-body::after {
    content: ""; position: absolute; bottom: 0; width: 60%; height: 100%;
    background: linear-gradient(to top, #fdf0f3, #fff);
  }
  .env-body::before { left: 0; clip-path: polygon(0 0, 100% 100%, 0 100%); }
  .env-body::after { right: 0; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  .flap {
    position: absolute; left: 0; right: 0; top: 0; height: 58%;
    background: linear-gradient(to bottom, var(--blush), #fbeef2);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top;
    border-radius: 6px 6px 0 0;
    z-index: 2;
    transition: transform .7s cubic-bezier(.6,.05,.3,1);
  }
  .seal {
    position: absolute; left: 50%; top: 58%; z-index: 3;
    width: 64px; height: 64px; margin: -32px 0 0 -32px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e48aa3, var(--deep) 75%);
    box-shadow: 0 4px 10px rgba(120, 30, 60, .35);
    display: grid; place-items: center;
    color: #fff; font-family: var(--script); font-size: 21px; letter-spacing: -.02em; line-height: 1;
    padding-top: 4px;
    transition: opacity .3s ease;
  }
  .to {
    position: absolute; left: 0; right: 0; bottom: 12%; z-index: 3;
    text-align: center;
  }
  .to .name { font-family: var(--script); font-size: clamp(28px, 7vw, 38px); color: var(--deep); }
  .to .hint {
    display: block; margin-top: 6px;
    font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
  }
  .envelope.opening .flap { transform: rotateX(180deg); }
  .envelope.opening .seal { opacity: 0; }
  .envelope.gone { opacity: 0; transform: translateY(30px) scale(.96); pointer-events: none; }

  /* Card */
  .card {
    position: relative;
    width: min(560px, 100%);
    background: var(--paper);
    border-radius: 4px;
    padding: clamp(28px, 6vw, 56px) clamp(22px, 6vw, 60px);
    box-shadow: 0 30px 60px -30px rgba(168, 63, 99, .45);
    outline: 1px solid var(--blush);
    outline-offset: -12px;
    animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.98); } to { opacity: 1; transform: none; } }
  .branch { display: block; width: 250px; max-width: 80%; margin: 0 auto 14px; }
  .eyebrow {
    text-align: center; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--rose);
    font-variant-numeric: tabular-nums;
  }
  h1 {
    margin: 10px 0 26px;
    text-align: center;
    font-family: var(--script); font-weight: 400;
    font-size: clamp(34px, 8.5vw, 52px);
    line-height: 1.25;
    color: var(--deep);
    text-wrap: balance;
  }
  .letter { display: grid; gap: 16px; max-width: 62ch; margin: 0 auto; font-size: 17.5px; line-height: 1.7; }
  .letter p { margin: 0; }
  .letter .open { font-style: italic; color: var(--muted); }
  .sign { margin-top: 26px; text-align: right; }
  .sign small { display: block; font-size: 14px; color: var(--muted); font-style: italic; }
  .sign span { font-family: var(--script); font-size: 30px; color: var(--deep); }

  .hero-photo {
    margin: 30px 0 28px;
    background: var(--paper);
    padding: 10px 10px 12px;
    box-shadow: 0 14px 30px -18px rgba(168, 63, 99, .5);
    outline: 1px solid var(--blush);
    transform: rotate(-1deg);
    position: relative;
  }
  .hero-photo::before {
    content: ""; position: absolute; top: -12px; left: 50%; width: 96px; height: 24px; margin-left: -48px;
    background: rgba(244, 182, 199, .7); transform: rotate(2deg);
  }
  .hero-photo img, .polaroid img { display: block; width: 100%; height: auto; }
  .memories { margin-top: 36px; display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
  .memories h2 {
    grid-column: 1 / -1; margin: 0 0 4px; text-align: center;
    font-family: var(--script); font-weight: 400; font-size: 28px; color: var(--deep);
  }
  .polaroid {
    margin: 0; background: var(--paper); padding: 8px 8px 22px;
    box-shadow: 0 12px 26px -16px rgba(168, 63, 99, .55);
    outline: 1px solid var(--blush);
    transition: transform .3s ease;
  }
  .polaroid.wide { grid-column: 1 / -1; transform: rotate(.8deg); }
  .polaroid.l { transform: rotate(-1.6deg); }
  .polaroid.r { transform: rotate(1.4deg); }
  .polaroid:hover { transform: rotate(0) scale(1.02); }
  @media (max-width: 420px) { .memories { gap: 10px; } .polaroid { padding: 6px 6px 16px; } }

  .letter:empty, [data-field]:empty { display: none; }
  .sign:has(small:empty):has(span:empty) { display: none; }
  .editor { display: grid; gap: 10px; max-width: 62ch; margin: 0 auto; }
  .ed-label { font-size: 13px; letter-spacing: .06em; color: var(--deep); font-weight: 500; }
  .ed-label span { color: var(--muted); font-weight: 400; font-style: italic; letter-spacing: 0; }
  .ed-f { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  .ed-f span { font-style: italic; }
  .ed-f input {
    font: 17px var(--serif); color: var(--ink); background: #fffafb;
    border: 1.5px dashed var(--petal); border-radius: 6px; padding: 10px 14px; width: 100%; box-sizing: border-box;
  }
  .ed-f input:focus { outline: none; border-color: var(--rose); border-style: solid; }
  #msg {
    width: 100%; box-sizing: border-box; resize: vertical; min-height: 220px;
    font: 17px/1.65 var(--serif); color: var(--ink);
    background: #fffafb; border: 1.5px dashed var(--petal); border-radius: 6px; padding: 14px 16px;
  }
  #msg:focus { outline: none; border-color: var(--rose); border-style: solid; }
  .ed-row { display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
  .ed-status { margin-right: auto; font-size: 13px; color: var(--muted); font-style: italic; }
  .ed-save, .ed-cancel, .ed-open {
    border: 0; border-radius: 999px; padding: 9px 18px; cursor: pointer;
    font: 500 14px var(--serif); letter-spacing: .03em;
  }
  .ed-save { background: var(--deep); color: #fff; }
  .ed-save:hover { background: #8f3353; }
  .ed-save:disabled { opacity: .6; cursor: default; }
  .ed-cancel { background: transparent; color: var(--muted); }
  .ed-open { display: block; margin: 14px auto 0; background: transparent; color: var(--deep); text-decoration: underline; text-underline-offset: 3px; }
  .ed-save:focus-visible, .ed-cancel:focus-visible, .ed-open:focus-visible { outline: 2px solid var(--deep); outline-offset: 3px; }
  .again {
    display: block; margin: 28px auto 0;
    background: var(--blush); color: var(--deep);
    border: 0; border-radius: 999px;
    padding: 10px 20px;
    font: 500 14px var(--serif); letter-spacing: .04em;
    cursor: pointer;
  }
  .again:hover { background: var(--petal); }
  .again-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 28px; }
  .again-row .again { margin: 0; }
  .reseal { background: transparent; outline: 1px solid var(--petal); }
  .again:focus-visible { outline: 2px solid var(--deep); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

    paras.forEach((t, i) => {
      const p = document.createElement('p');
      if (i === 0 && paras.length > 1 && t.length < 40 && t.endsWith(',')) p.className = 'open';
      t.split('\n').forEach((line, j) => { if (j) p.appendChild(document.createElement('br')); p.appendChild(document.createTextNode(line)); });
      letterEl.appendChild(p);
    });
  }
  function renderFields(src) {
    FIELDS.forEach(k => document.querySelectorAll('[data-field="' + k + '"]').forEach(el => { el.textContent = (src[k] || '').trim(); }));
  }
  renderLetter();
  renderFields(state);

  const env = document.getElementById('envelope');
  const card = document.getElementById('card');
  const again = document.getElementById('again');
  const cvs = document.getElementById('petals');
  const ctx = cvs.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let petals = [], running = false, W, H, dpr;

  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cvs.width = W * dpr; cvs.height = H * dpr;
    cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size(); addEventListener('resize', size);

  const colors = ['#f4b6c7', '#f7c9d5', '#eea3b8', '#fff4f7', '#e88aa4', '#ffffff'];
  function burst(n) {
    for (let i = 0; i < n; i++) {
      petals.push({
        x: Math.random() * W,
        y: -20 - Math.random() * H * 0.8,
        r: 4 + Math.random() * 4,
        vy: 0.7 + Math.random() * 1.3,
        sway: Math.random() * Math.PI * 2,
        swaySpeed: 0.01 + Math.random() * 0.02,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.04,
        c: colors[(Math.random() * colors.length) | 0]
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function drawPetal(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.scale(1, 0.6 + 0.4 * Math.abs(Math.sin(p.sway)));
    const L = p.r * 1.9, w = p.r * 0.7;
    ctx.fillStyle = p.c;
    ctx.strokeStyle = 'rgba(217,113,143,.55)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(0, L);
    ctx.bezierCurveTo(w * 1.4, L * 0.3, w, -L * 0.6, 0, -L);
    ctx.bezierCurveTo(-w, -L * 0.6, -w * 1.4, L * 0.3, 0, L);
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, L * 0.8); ctx.lineTo(0, -L * 0.7);
    ctx.strokeStyle = 'rgba(201,87,122,.5)'; ctx.stroke();
    ctx.fillStyle = '#a83f63';
    ctx.beginPath(); ctx.arc(w * 0.3, L * 0.1, 0.9, 0, 7); ctx.arc(-w * 0.3, -L * 0.15, 0.8, 0, 7); ctx.fill();
    ctx.restore();
  }
  function tick() {
    ctx.clearRect(0, 0, W, H);
    petals.forEach(p => {
      p.sway += p.swaySpeed;
      p.x += Math.sin(p.sway) * 0.8;
      p.y += p.vy;
      p.rot += p.vr;
      drawPetal(p);
    });
    petals = petals.filter(p => p.y < H + 30);
    if (petals.length) requestAnimationFrame(tick);
    else { running = false; ctx.clearRect(0, 0, W, H); }
  }

  function open() {
    if (env.classList.contains('opening')) return;
    env.classList.add('opening');
    setTimeout(() => env.classList.add('gone'), reduce ? 0 : 650);
    setTimeout(() => {
      env.hidden = true;
      card.hidden = false;
      if (!reduce) burst(90);
      card.setAttribute('tabindex', '-1');
      card.focus({ preventScroll: true });
    }, reduce ? 0 : 1150);
  }
  env.addEventListener('click', open);
  again.addEventListener('click', () => { if (!reduce) burst(70); });
  document.getElementById('reseal').addEventListener('click', () => {
    card.hidden = true;
    env.hidden = false;
    env.classList.remove('opening', 'gone');
    // restart the card's rise animation next time it opens
    card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
    window.scrollTo({ top: 0 });
    env.focus();
  });
})();
</script>

<!--card-end-->
